name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Offline tests
        run: pytest tests -q
      - name: Integration tests against the published release
        # Only once per matrix, to avoid hammering the release assets.
        if: matrix.python-version == '3.12'
        run: pytest tests -q --run-network
